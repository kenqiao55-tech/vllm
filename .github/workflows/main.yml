  workflow_dispatch:

jobs:
  job_a:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "A start"
          sleep 15
          echo "A end"

  job_b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "B start"
          sleep 5
          echo "B end"

  job_c:
